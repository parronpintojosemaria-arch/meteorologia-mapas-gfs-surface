name: vNext · Candidato Pages · GFS surface · 2.058 mapas

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vnext-publish-candidate.yml'

permissions:
  contents: read
  pages: write
  id-token: write

environment:
  name: github-pages

concurrency:
  group: pages-gfs-surface-candidate
  cancel-in-progress: false

jobs:
  build:
    name: Generar y validar GFS surface HD
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      cycle: ${{ steps.cycle.outputs.cycle }}
    steps:
      - name: Checkout destino
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar backend vNext
        run: |
          set -euo pipefail
          git clone --depth 1 --branch vnext-mapas-profesional \
            https://github.com/parronpintojosemaria-arch/meteorologia-mapas-backend.git backend

      - name: Dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar generadores
        working-directory: backend
        run: |
          python -m py_compile scripts/vnext_gfs_generate.py
          python -m py_compile scripts/vnext_gfs_preflight.py
          python -m py_compile scripts/vnext_gfs_precip_guard.py
          python -m py_compile scripts/vnext_current_guard.py

      - name: Elegir ciclo GFS completo +384 h
        working-directory: backend
        run: python scripts/vnext_gfs_generate.py prepare

      - id: cycle
        name: Exportar ciclo
        working-directory: backend
        shell: bash
        run: |
          CYCLE=$(python -c "import json;print(json.load(open('vnext-full-out/gfs/prep.json'))['cycle'])")
          echo "cycle=$CYCLE" >> "$GITHUB_OUTPUT"
          echo "CYCLE=$CYCLE" >> "$GITHUB_ENV"
          echo "GFS surface ciclo seleccionado: $CYCLE"

      - name: Generar 2.058 mapas surface · España 2400 · Europa 2800 · q92
        working-directory: backend
        timeout-minutes: 330
        run: python scripts/vnext_gfs_generate.py surface --cycle "$CYCLE"

      - name: Construir manifest del shard y validar todos los archivos
        working-directory: backend
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from PIL import Image

          cycle=os.environ['CYCLE']
          root=Path('vnext-full-out/gfs/cycles')/cycle
          frag=root/'fragment-surface.json'
          d=json.loads(frag.read_text(encoding='utf-8'))
          assert d['status']=='ready'
          assert d['group']=='surface'
          assert d['expected_count']==2058
          assert len(d['files'])==2058
          widths={'spain':2400,'europe':2800}
          total=0
          for row in d['files']:
              p=root/row['path']
              assert p.is_file() and p.stat().st_size>100
              assert row['width']==widths[row['domain']]
              assert row['height']>900
              total += p.stat().st_size
          for row in (d['files'][0], d['files'][len(d['files'])//2], d['files'][-1]):
              with Image.open(root/row['path']) as im:
                  im.verify()
          mib=total/(1024*1024)
          assert mib < 940.0, f'GFS surface supera guard Pages: {mib:.2f} MiB'
          manifest=dict(d)
          manifest['schema']='vnext-gfs-shard-1'
          manifest['publication_role']='gfs-surface-shard'
          manifest['production_changed']=False
          (root/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(f'GFS SURFACE SHARD OK · 2058 mapas · {mib:.2f} MiB')
          PY

      - name: Preparar sitio candidato
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "../site/cycles/$CYCLE"
          cp -a "vnext-full-out/gfs/cycles/$CYCLE/." "../site/cycles/$CYCLE/"
          python scripts/vnext_current_guard.py \
            --model gfs-surface \
            --cycle "$CYCLE" \
            --cycle-dir "vnext-full-out/gfs/cycles/$CYCLE" \
            --base-url 'https://parronpintojosemaria-arch.github.io/meteorologia-mapas-gfs-surface' \
            --output ../site/current.json
          cat > ../site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Meteorología Interactiva · GFS surface</title>
          <h1>Meteorología Interactiva · GFS surface</h1>
          <p>Candidato vNext HD. Datos: NOAA/NCEP GFS. Este sitio no cambia WordPress por sí solo.</p>
          <p><a href="current.json">current.json</a></p>
          HTML
          touch ../site/.nojekyll

      - name: Guard final candidato
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('site/current.json').read_text())
          assert c['status']=='ready' and c['model']=='gfs-surface' and c['file_count']==2058
          assert Path('site/cycles',c['cycle'],'manifest.json').is_file()
          print('CURRENT CANDIDATO GFS SURFACE OK',c['cycle'],c['file_count'])
          PY

      - name: Configurar GitHub Pages en este repositorio aislado
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar candidato Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1

  deploy:
    name: Publicar candidato aislado GFS surface
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar Pages
        id: deployment
        uses: actions/deploy-pages@v4
